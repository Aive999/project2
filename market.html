<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Currency Market</title>
  <link rel="stylesheet" href="styles.css?v=withdraw-receiving-account-20260703" />
</head>
<body>
  <div class="page-shell">
    <header class="hero-header">
      <div class="header-top">
        <div class="avatar"></div>
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">&#128269;</span>
          <input type="text" placeholder="Search currency pair" aria-label="Search currency pair" />
        </div>
        <div class="header-actions">
          <button class="icon-button" aria-label="Language" title="Language">&#127760;</button>
          <button class="icon-button account-button" aria-label="Login or register" title="Login or register">&#128100;</button>
        </div>
      </div>
      <section class="hero-banner">
        <div class="hero-copy">
          <p class="eyebrow">Market</p>
          <h1>Foreign exchange market</h1>
          <p class="hero-description">Browse currency pairs, prices, volume and 24h changes in a clean market tab view.</p>
        </div>
      </section>
    </header>

    <main>
      <section class="market-tab currency-rates-tab" id="market">
        <div class="currency-rate-title">Currency Rates</div>
        <div class="market-list-card currency-rate-list">
          <div class="market-list-header currency-rate-header">
            <label class="inverse-control">Inverse USD <input id="marketInverse" type="checkbox"><i></i></label>
            <span>Rate</span>
            <span>Change (24h)</span>
            <span>Chart (24h)</span>
            <button type="button">Edit</button>
          </div>
          <div class="market-row currency-rate-row base-rate-row">
            <div class="market-pair"><span class="pair-icon flag-icon">US</span><div><div class="pair-name">US Dollar</div></div></div>
            <div class="market-price">1</div>
            <div class="market-change"></div>
            <div class="market-chart"></div>
            <div></div>
          </div>
        </div>
      </section>

      <nav class="main-nav">
        <a href="index.html" class="nav-item"><span aria-hidden="true">&#127968;</span><span>Home</span></a>
        <a href="market.html" class="nav-item active"><span aria-hidden="true">&#128200;</span><span>Market</span></a>
        <a href="trade.html" class="nav-item"><span aria-hidden="true">&#128202;</span><span>Trade</span></a>
        <a href="account.html" class="nav-item"><span aria-hidden="true">&#128188;</span><span>Account</span></a>
      </nav>
    </main>
  </div>
  <script src="user-app.js?v=withdraw-receiving-account-20260703"></script>
</body>
</html>
