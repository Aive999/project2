<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>International Forex Support</title>
  <link rel="stylesheet" href="styles.css?v=separate-support-page-20260703" />
</head>
<body class="support-page">
  <div class="support-page-shell">
    <section class="support-panel support-page-panel" aria-label="Chat support">
      <div class="support-topbar">
        <strong>Chat Support</strong>
        <a href="index.html" class="support-close" aria-label="Back home">x</a>
      </div>
      <div class="support-thread">
        <button type="button" class="support-more">More messages</button>
        <div class="support-message-row">
          <div class="support-avatar support-headset" aria-hidden="true"><span>&#127911;</span></div>
          <div class="support-message-body">
            <div class="support-agent-line"><strong>Online Service</strong><span>Offline</span></div>
            <div class="support-bubble">The customer service is very busy and is taking a break. Please leave your email address and other contact information. We will contact you as soon as we are online.</div>
          </div>
        </div>
      </div>
      <div class="support-ended">
        <p>This conversation has ended. You can choose to</p>
        <div class="support-actions">
          <button type="button" id="supportPageContinue"><span aria-hidden="true">&#128172;</span><strong>Continue chatting</strong></button>
          <button type="button" id="supportPageLeaveMessage"><span aria-hidden="true">&#9998;</span><strong>Leave a message</strong></button>
        </div>
      </div>
    </section>

    <nav class="main-nav">
      <a href="index.html" class="nav-item"><span aria-hidden="true">&#127968;</span><span>Home</span></a>
      <a href="market.html" class="nav-item"><span aria-hidden="true">&#128200;</span><span>Market</span></a>
      <a href="trade.html" class="nav-item"><span aria-hidden="true">&#128202;</span><span>Trade</span></a>
      <a href="account.html" class="nav-item"><span aria-hidden="true">&#128188;</span><span>Account</span></a>
    </nav>
  </div>
  <script src="user-app.js?v=separate-support-page-20260703"></script>
</body>
</html>
