<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Trade</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero-header">
      <div class="header-top">
        <div class="hero-title">
          <div class="title-icon" aria-hidden="true">&#9776;</div>
          <div>
            <div class="symbol-label">BTC/USDT</div>
            <div class="symbol-sub">Spot</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-button" aria-label="Favorite" title="Favorite">&#9733;</button>
          <button class="icon-button" aria-label="Chart" title="Chart">&#128202;</button>
          <button class="icon-button" aria-label="Menu" title="Menu">&#9776;</button>
        </div>
      </div>
      <section class="trade-banner">
        <div class="trade-price-row">
          <div class="trade-price">63,670.71</div>
          <div class="trade-change negative">0.18%</div>
        </div>
        <div class="trade-meta-row">
          <div>High 64,388</div>
          <div>Low 62,844.5</div>
          <div>24H 164.7703</div>
        </div>
      </section>
    </header>

    <main>
      <section class="chart-card">
        <div class="chart-toolbar">
          <button class="chart-tab active">1min</button>
          <button class="chart-tab">15min</button>
          <button class="chart-tab">1h</button>
          <button class="chart-tab">More</button>
          <button class="chart-tab">Index</button>
        </div>
        <div class="chart-placeholder">
          <div class="chart-line"></div>
          <span>8.45k</span>
        </div>
      </section>

      <section class="trade-actions">
        <button class="trade-button buy">Buy/long</button>
        <button class="trade-button sell">Buy/short</button>
      </section>

      <section class="trade-tab-row">
        <button class="trade-tab active">Position order</button>
        <button class="trade-tab">Historical Order</button>
        <button class="trade-tab">Profit order</button>
      </section>

      <section class="status-card">
        <p>Loading trading ticket...</p>
      </section>

      <nav class="main-nav">
        <a href="index.html" class="nav-item"><span aria-hidden="true">&#127968;</span><span>Home</span></a>
        <a href="market.html" class="nav-item"><span aria-hidden="true">&#128200;</span><span>Market</span></a>
        <a href="options.html" class="nav-item"><span aria-hidden="true">&#9889;</span><span>Options</span></a>
        <a href="trade.html" class="nav-item active"><span aria-hidden="true">&#9881;</span><span>Trade</span></a>
        <a href="wallet.html" class="nav-item"><span aria-hidden="true">&#128188;</span><span>Wallet</span></a>
      </nav>
    </main>
  </div>
  <script src="user-app.js?v=mysql-20260618"></script>
</body>
</html>
