<!DOCTYPE html>
<html lang="en">
<head>
<title>Admin Login</title>
<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="bg-circles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="login-box">
    <div class="login-brand">
        <div class="login-logo">G</div>
        <div>
            <h2>Admin Portal</h2>
            <p>Gemini Currency Backstage Management System</p>
        </div>
    </div>

    <div class="login-meta">
        <span>Secure admin access</span>
        <span>Operations console</span>
    </div>

    <form id="loginForm">
        <label>
            <span>Username</span>
            <input type="text" id="username" placeholder="admin" autocomplete="username" required>
        </label>

        <label>
            <span>Password</span>
            <div class="password-field">
                <input type="password" id="password" placeholder="admin@12345" autocomplete="current-password" required>
                <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
                    &#128065;
                </button>
            </div>
        </label>

        <button type="submit">Sign in</button>
        <p id="error"></p>
    </form>

    <div class="login-support">
        
        <div>
            <strong>Session</strong>
            <span>Local browser access</span>
        </div>
    </div>
</div>

<script src="admin.js?v=login-fix-20260620"></script>
</body>
</html>
