<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Currency Account</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="wallet-header">
      <div class="wallet-balance">
        <div class="wallet-title">Total balance conversion (USD)</div>
        <div class="wallet-amount">0</div>
        <div class="wallet-usd">approx $0</div>
      </div>
      <div class="wallet-actions">
        <button class="wallet-action"><span aria-hidden="true">&#11015;</span><span>Deposit</span></button>
        <button class="wallet-action"><span aria-hidden="true">&#11014;</span><span>Withdraw</span></button>
        <button class="wallet-action"><span aria-hidden="true">&#128177;</span><span>Exchange</span></button>
      </div>
    </header>

    <main>
      <section class="wallet-panel">
        <div class="wallet-tabs">
          <button class="wallet-tab active">Balances</button>
          <button class="wallet-tab">Records</button>
        </div>
        <div class="wallet-summary">
          <div class="wallet-summary-title">Account balance conversion (USD)</div>
          <div class="wallet-summary-value">0</div>
          <div class="wallet-summary-usd">approx $0</div>
        </div>
        <div class="wallet-status">
          <div class="wallet-status-message">Login status expired, please log in again!</div>
        </div>
        <div class="wallet-controls">
          <label class="checkbox-row"><input type="checkbox" /> Hide Small Currency</label>
          <div class="search-row">
            <span class="search-icon" aria-hidden="true">&#128269;</span>
            <input type="text" placeholder="search" aria-label="Search" />
          </div>
        </div>
      </section>

      <nav class="main-nav">
        <a href="index.html" class="nav-item"><span aria-hidden="true">&#127968;</span><span>Home</span></a>
        <a href="market.html" class="nav-item"><span aria-hidden="true">&#128200;</span><span>Market</span></a>
        <a href="options.html" class="nav-item"><span aria-hidden="true">&#9889;</span><span>Options</span></a>
        <a href="trade.html" class="nav-item"><span aria-hidden="true">&#9881;</span><span>Trade</span></a>
        <a href="wallet.html" class="nav-item active"><span aria-hidden="true">&#128188;</span><span>Account</span></a>
      </nav>
    </main>
  </div>
  <script src="user-app.js?v=mysql-20260618"></script>
</body>
</html>
